services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: physio
      POSTGRES_PASSWORD: physio
      POSTGRES_DB: physio_call
    ports:
      - "5432:5432"
    volumes:
      - physio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio -d physio_call"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  physio_pg:
